name: Bonzatko
options:
  bundleIdPrefix: cz.stefansvec
  deploymentTarget:
    macOS: "26.0"
  developmentLanguage: cs
  createIntermediateGroups: true

packages:
  CoreXLSX:
    url: https://github.com/CoreOffice/CoreXLSX.git
    exactVersion: 0.14.2
  ZIPFoundation:
    url: https://github.com/weichsel/ZIPFoundation.git
    exactVersion: 0.9.20
  libxlsxwriter:
    url: https://github.com/jmcnamara/libxlsxwriter.git
    exactVersion: 1.2.4

settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
    ENABLE_USER_SCRIPT_SANDBOXING: YES

targets:
  Bonzatko:
    type: application
    platform: macOS
    sources:
      - path: Bonzatko
    dependencies:
      - package: CoreXLSX
      - package: ZIPFoundation
      - package: libxlsxwriter
    info:
      path: Bonzatko/Info.plist
      properties:
        CFBundleDisplayName: Bonzátko
        CFBundleName: Bonzátko
        CFBundleDevelopmentRegion: cs
        CFBundleLocalizations: [cs]
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        LSApplicationCategoryType: public.app-category.education
        NSHumanReadableCopyright: "© 2026 Štefan Švec"
        NSDesktopFolderUsageDescription: Bonzátko ukládá exporty docházky do složky na Ploše.
    settings:
      base:
        PRODUCT_NAME: Bonzatko
        PRODUCT_MODULE_NAME: Bonzatko
        PRODUCT_BUNDLE_IDENTIFIER: cz.stefansvec.bonzatko
        ENABLE_APP_SANDBOX: NO
        ENABLE_HARDENED_RUNTIME: NO
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  BonzatkoTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: BonzatkoTests
    dependencies:
      - target: Bonzatko
      - package: ZIPFoundation
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cz.stefansvec.bonzatko.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Bonzatko.app/Contents/MacOS/Bonzatko"
        BUNDLE_LOADER: "$(TEST_HOST)"

schemes:
  Bonzatko:
    build:
      targets:
        Bonzatko: all
        BonzatkoTests: [test]
    test:
      targets: [BonzatkoTests]
    run:
      config: Debug
